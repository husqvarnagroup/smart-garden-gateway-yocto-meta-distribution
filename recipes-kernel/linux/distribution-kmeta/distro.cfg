# disable kernel samples
CONFIG_SAMPLES=n
CONFIG_SAMPLE_KOBJECT=n
CONFIG_SAMPLE_KFIFO=n
CONFIG_SAMPLE_CONFIGFS=n
# disable wifi regdb sigcheck
CONFIG_CFG80211_CERTIFICATION_ONUS=y
CONFIG_CFG80211_REQUIRE_SIGNED_REGDB=n
# enable compaction
CONFIG_COMPACTION=y
CONFIG_MIGRATION=y
# enable coredump
CONFIG_CORE_DUMP_DEFAULT_ELF_HEADERS=y
CONFIG_COREDUMP=y
# enable debugfs
CONFIG_BLK_DEBUG_FS=y
CONFIG_CFG80211_DEBUGFS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_DEBUG_FS=y
# enable devmem
CONFIG_DEVMEM=y
# enable executable format elf
CONFIG_ELF_CORE=y
CONFIG_BINFMT_ELF=y
CONFIG_ELFCORE=y
# enable executable format script
CONFIG_BINFMT_SCRIPT=y
# enable keyboard button
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_GPIO=y
# enable leds
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_USER=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_GPIO=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y
CONFIG_LEDS_TRIGGER_NETDEV=y
CONFIG_LEDS_TRIGGER_ONESHOT=y
CONFIG_LEDS_TRIGGER_TIMER=y
CONFIG_LEDS_TRIGGER_TRANSIENT=y
# enable misc stuff
CONFIG_FUTEX=y
CONFIG_FUTEX_PI=y
CONFIG_EVENTFD=y
CONFIG_MEMBARRIER=y
CONFIG_VM_EVENT_COUNTERS=y
# enable mtd tests
CONFIG_MODULES_USE_ELF_REL=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MTD_TESTS=m
# Only 457 of the 7691 symbols vmlinux exports are referenced by any
# module we build, and the tables are resident for the life of the box.
# Trimming them saves ~218 kB of RAM. Requires that all modules are
# built in-tree, which is the case (no recipe inherits module.bbclass).
CONFIG_TRIM_UNUSED_KSYMS=y
# No consumer of the bpf() syscall is installed, and systemd is built
# with -Dbpf-framework=disabled. Classic BPF stays available either way
# (kernel/bpf/core.o is obj-y), so tcpdump and CONFIG_PPP_FILTER are
# unaffected. Revisit if a unit ever needs DeviceAllow= or
# IPAddressAllow=, which systemd can only enforce through BPF.
# CONFIG_BPF_SYSCALL is not set
# enable multiuser
CONFIG_MULTIUSER=y
# enable netfilter
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CT_NETLINK=y
# needed by NFT_COMPAT (built-in) and kernel-module-xt-dscp, not by
# legacy iptables (nftables front-end uses nft_compat, not ip_tables)
CONFIG_NETFILTER_XTABLES=y
CONFIG_NF_DEFRAG_IPV4=y
CONFIG_NF_REJECT_IPV4=y
CONFIG_NF_REJECT_IPV6=y
CONFIG_NF_DEFRAG_IPV6=y
CONFIG_NETFILTER_ADVANCED=y

# Add netfilter traffic class match and modification capability
CONFIG_NETFILTER_XT_TARGET_DSCP=m
CONFIG_NETFILTER_XT_MATCH_DSCP=y
# enable net sched
CONFIG_NET_SCHED=y
# enable nfsroot
CONFIG_FILE_LOCKING=y
CONFIG_NETWORK_FILESYSTEMS=y
CONFIG_NFS_FS=y
CONFIG_NFS_V3=y
CONFIG_ROOT_NFS=y
# enable panic on oops
CONFIG_PANIC_ON_OOPS=y
# enable ppp
CONFIG_PPP=y
CONFIG_PPP_FILTER=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_SLHC=y
CONFIG_CRC_CCITT=y
# enable printk
# Every record costs a statically allocated printk_info, so shift 17
# reserved 528 kB before userspace started. journald copies the buffer
# to zram seconds into boot, so it only has to span early boot. Shift 15
# leaves 32 kB for that, roughly twice what this board prints at
# loglevel 4. Do not go lower without checking a full boot against it.
CONFIG_LOG_BUF_SHIFT=15
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y
# CONFIG_BOOT_PRINTK_DELAY is not set
CONFIG_EARLY_PRINTK=y
# enable proc page monitor
CONFIG_PROC_PAGE_MONITOR=y
# enable rfkill
CONFIG_RFKILL=y
# enable shmem
CONFIG_SHMEM=y
# enable sysrq
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1
CONFIG_MAGIC_SYSRQ_SERIAL=y
# enable systemd requirements
CONFIG_CGROUPS=y
CONFIG_USER_NS=y
CONFIG_UTS_NS=y
CONFIG_TMPFS=y
CONFIG_CRYPTO_USER_API=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_INOTIFY_USER=y
CONFIG_NET=y
CONFIG_SYSFS=y
CONFIG_PROC_FS=y
CONFIG_NET_NS=y
CONFIG_FHANDLE=y
CONFIG_EPOLL=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_FW_LOADER_USER_HELPER=n
CONFIG_SYSCTL=y
CONFIG_PROC_SYSCTL=y
CONFIG_NAMESPACES=y
# systemd: strongly recommended
CONFIG_IPV6=y
CONFIG_AUTOFS_FS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_FS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_NET_CORE=y
# MTD
CONFIG_MTD=y
CONFIG_MTD_CMDLINE_PARTS=y
# UBI
CONFIG_MISC_FILESYSTEMS=y
CONFIG_BLOCK=y
CONFIG_MTD_UBI=y
CONFIG_MTD_UBI_BLOCK=y
CONFIG_UBIFS_FS=y
CONFIG_UBIFS_FS_ADVANCED_COMPR=y
CONFIG_UBIFS_FS_LZO=y
CONFIG_UBIFS_FS_XATTR=y
CONFIG_UBIFS_FS_ZLIB=y
# enable squashfs
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_FILE_CACHE=y
CONFIG_SQUASHFS_DECOMP_SINGLE=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_XZ_DEC=y
# enable watchdog
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
CONFIG_WATCHDOG_NOWAYOUT=y
# enable wifi
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_CFG80211_CRDA_SUPPORT=y
CONFIG_CFG80211_DEFAULT_PS=y
CONFIG_MAC80211=m
CONFIG_MAC80211_RC_MINSTREL=y
# enable crypto modules needed by wpa_supplicant
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_CTR=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_GHASH=y
CONFIG_CRYPTO_LIB_AES=y
CONFIG_CRYPTO_MICHAEL_MIC=y
CONFIG_CRYPTO_NULL=y
# set default loglevel
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=4
# SG-18053 zram (and related) for compressing journalctl logs in memory.
CONFIG_ZRAM=y
CONFIG_ZRAM_BACKEND_ZSTD=y
CONFIG_ZSMALLOC=y
CONFIG_EXT4_FS=y

# Downstream U-Boot bootcount driver
CONFIG_UBOOT_BOOTCOUNT=y

# Enable high-resolution timers for fast SPI NAND access (mt7688).
# HZ_1000 or better is needed to speed up Clause 45 PHY scan (at91sam).
CONFIG_HIGH_RES_TIMERS=y

# Unsorted
CONFIG_SYSVIPC=y
CONFIG_SLUB=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_INET=y
CONFIG_IP_PNP=y
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_PHYLIB=y
CONFIG_TTY=y
CONFIG_VT=y
CONFIG_CONSOLE_TRANSLATIONS=y
CONFIG_VT_CONSOLE=y
CONFIG_VT_HW_CONSOLE_BINDING=y
CONFIG_UNIX98_PTYS=y
CONFIG_POWER_RESET=y
CONFIG_EXPERT=y
CONFIG_CC_OPTIMIZE_FOR_SIZE=y
CONFIG_DNOTIFY=y
CONFIG_FANOTIFY=y
CONFIG_FSNOTIFY=y
CONFIG_CRYPTO_ECB=y
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y
CONFIG_USB_DEFAULT_PERSIST=y
CONFIG_COMPAT_32BIT_TIME=y
CONFIG_POSIX_TIMERS=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_BLK_CGROUP=y
CONFIG_PAGE_COUNTER=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_BASE_SMALL=y

# Security
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y

# Allow userspace to interact with GPIOs
CONFIG_GPIO_CDEV=y
# As of Yocto Dunnfell, userland works only with v1
CONFIG_GPIO_CDEV_V1=y
# Bring back /sys/class/gpio/(un)export for OpenOCD
CONFIG_GPIO_SYSFS_LEGACY=y

# R2D2-4481 - Introduced for testing
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_CT=y
CONFIG_NFT_REJECT=y
CONFIG_NFT_COMPAT=y
CONFIG_VLAN_8021Q=m

# Allow debug statements to be printed at runtime. This will increase the
# kernel text size by about 2%.
CONFIG_DYNAMIC_DEBUG=y
CONFIG_DYNAMIC_DEBUG_CORE=y
